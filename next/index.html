<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Natsumi Sugiyama — Archive</title>
<meta name="description" content="Projects, research, and ongoing practice by Natsumi Sugiyama.">
<meta property="og:title" content="Natsumi Sugiyama — Archive">
<meta property="og:image" content="img/A_ART014/00.webp">
<link rel="stylesheet" href="site.css">
</head>
<body>

<header class="top">
  <a class="name" href="#top" id="top">Natsumi Sugiyama</a>
  <nav class="menu" aria-label="Sections">
    <a href="#archive">Archive</a>
    <a href="#bookshelf">Bookshelf</a>
    <a href="#info">Info</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-set-lang="ja" aria-pressed="false">JP</button>
  </div>
</header>

<main>
  <section class="selected" id="selected" aria-label="Selected series"></section>

  <section class="archive" id="archive" aria-labelledby="archiveTitle">
    <div class="bar">
      <h2 id="archiveTitle">Archive</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter"></div>
      <div class="views" role="group" aria-label="View">
        <button type="button" data-view="grid" aria-pressed="true">Images</button>
        <button type="button" data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
    <div class="sheet" id="sheet"></div>
  </section>

  <section class="bookshelf" id="bookshelf" aria-labelledby="bookTitle">
    <div class="bar">
      <h2 id="bookTitle">Bookshelf</h2>
      <div class="filters" id="shelfTabs" role="group" aria-label="Shelf"></div>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>

  <section class="info" id="info" aria-labelledby="infoTitle">
    <h2 id="infoTitle">Info</h2>
    <div class="info-text">
      <p data-t="info">Works across information, editorial, and artistic practice. Based in Berlin, with a background in design and in Public Art and New Artistic Strategies.</p>
    </div>
    <p class="contact"><span data-t="contact">Contact</span><br><a href="mailto:n@natyama.com">n@natyama.com</a></p>
  </section>
</main>

<footer class="foot">© Natsumi Sugiyama</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vTitle" hidden>
  <button type="button" class="v-close" id="vClose" data-t="close">Close</button>
  <div class="v-scroll" id="vScroll">
    <div class="v-strip" id="vStrip" tabindex="0" aria-label="Images"></div>
    <div class="v-text">
      <div>
        <h2 id="vTitle"></h2>
        <p class="v-sub" id="vSub"></p>
      </div>
      <div class="v-body" id="vBody"></div>
      <dl class="v-facts" id="vFacts"></dl>
    </div>
    <nav class="v-nav" aria-label="Other works">
      <button type="button" id="vPrev"></button>
      <button type="button" id="vNext"></button>
    </nav>
  </div>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
</body>
</html>
