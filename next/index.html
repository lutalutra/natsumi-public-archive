<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natsumi Sugiyama — Archive</title>
<meta name="description" content="Projects, research, and ongoing practice by Natsumi Sugiyama.">
<meta property="og:title" content="Natsumi Sugiyama — Archive">
<meta property="og:image" content="img/A_ART014/hero_00.webp">
<link rel="stylesheet" href="site.css">
</head>
<body>

<header class="top on-dark" id="top">
  <a class="name" href="#hero">Natsumi Sugiyama</a>
  <nav class="menu" aria-label="Sections">
    <a href="#archive">Archive</a>
    <a href="#bookshelf">Bookshelf</a>
    <a href="#chronology" data-t="nav.index">Index</a>
    <a href="#info">Info</a>
  </nav>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-set-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-set-lang="ja" aria-pressed="false">JP</button>
  </div>
</header>

<main>
  <section class="hero" id="hero" aria-roledescription="carousel" aria-label="Selected works">
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-foot" id="heroFoot">
      <button type="button" class="hero-cap" id="heroCap"></button>
      <div class="slider-ui">
        <div class="ticks" id="heroTicks" role="group" aria-label="Choose image"></div>
        <div class="steps">
          <button type="button" id="heroPrev" aria-label="Previous image">←</button>
          <span class="count" id="heroCount" aria-live="polite"></span>
          <button type="button" id="heroNext" aria-label="Next image">→</button>
        </div>
      </div>
    </div>
  </section>

  <section class="archive" id="archive" aria-labelledby="archiveTitle">
    <div class="bar">
      <h2 id="archiveTitle">Archive</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter"></div>
      <div class="views" role="group" aria-label="View">
        <button type="button" data-view="grid" aria-pressed="true">Images</button>
        <button type="button" data-view="list" aria-pressed="false">List</button>
      </div>
    </div>
    <div class="media" id="media" role="group" aria-label="Medium"></div>
    <div class="sheet" id="sheet"></div>
  </section>

  <section class="bookshelf" id="bookshelf" aria-labelledby="bookTitle">
    <div class="bar"><h2 id="bookTitle">Bookshelf</h2></div>
    <div id="shelves"></div>
  </section>

  <section class="chrono" id="chronology" aria-labelledby="chronoTitle">
    <div class="bar">
      <h2 id="chronoTitle" data-t="nav.index">Index</h2>
      <div class="filters" id="tracks" role="group" aria-label="Show"></div>
    </div>
    <div class="chrono-body">
      <div class="chart" id="chart"></div>
      <aside class="peek" id="peek" aria-live="polite"></aside>
    </div>
  </section>

  <section class="info" id="info" aria-labelledby="infoTitle">
    <h2 id="infoTitle">Info</h2>
    <div class="info-text"><p data-t="info"></p></div>
    <p class="contact"><span data-t="contact">Contact</span><br><a href="mailto:n@natyama.com">n@natyama.com</a></p>
  </section>
</main>

<footer class="foot">© Natsumi Sugiyama</footer>

<div class="gallery shell" id="gallery" role="dialog" aria-modal="true" aria-labelledby="gTitle" hidden>
  <div class="g-stage" id="gStage">
    <div class="g-frame" id="gFrame"></div>
    <button type="button" class="g-hit prev" id="gPrevImg" aria-label="Previous image"></button>
    <button type="button" class="g-hit next" id="gNextImg" aria-label="Next image"></button>
  </div>
  <p class="s-title"><span id="gTitle"></span><span class="s-sub" id="gYear"></span></p>
  <nav class="rail" aria-label="Controls"><button type="button" class="ic" id="gClose" aria-label="Close" data-tip="Close" data-t-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button type="button" class="ic" id="gInfoBtn" aria-label="Info" data-tip="Info" data-t-label="infoBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button><button type="button" class="ic" id="gGridBtn" aria-label="All images" data-tip="All images" data-t-label="all.images"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button><button type="button" class="ic" id="gHome" aria-label="Back to top" data-tip="Back to top" data-t-label="top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></nav>
  <div class="s-steps" id="gSteps">
    <button type="button" class="ic" id="gLeft" aria-label="Previous image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="count" id="gCount" aria-live="polite"></span>
    <button type="button" class="ic" id="gRight" aria-label="Next image"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="g-grid" id="gGrid" hidden></div>
  <aside class="g-info" id="gInfo" hidden>
    <div class="g-info-in">
      <h2 id="iTitle"></h2>
      <p class="v-sub" id="iSub"></p>
      <ul class="tags" id="iTags"></ul>
      <div class="v-body" id="iBody"></div>
      <dl class="v-facts" id="iFacts"></dl>
      <nav class="i-nav" aria-label="Other works">
        <button type="button" id="iPrev"></button>
        <button type="button" id="iNext"></button>
      </nav>
    </div>
  </aside>
</div>

<div class="reader shell" id="reader" role="dialog" aria-modal="true" aria-labelledby="rTitle" hidden>
  <div class="r-stage" id="rStage">
    <div class="r-book" id="rBook"></div>
  </div>
  <p class="s-title"><span id="rTitle"></span><span class="s-sub" id="rYear"></span></p>
  <nav class="rail" aria-label="Controls"><button type="button" class="ic" id="rClose" aria-label="Close" data-tip="Close" data-t-label="close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><button type="button" class="ic" id="rWork" aria-label="About this work" data-tip="About this work" data-t-label="about.work"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button><a class="ic" id="rPdf" target="_blank" rel="noopener" aria-label="Open PDF" data-tip="Open PDF" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/><path d="M10 13h5M10 16.5h5"/></svg></a><button type="button" class="ic" id="rHome" aria-label="Back to top" data-tip="Back to top" data-t-label="top"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button></nav>
  <div class="s-steps">
    <button type="button" class="ic" id="rLeft" aria-label="Previous page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="count" id="rCount" aria-live="polite"></span>
    <button type="button" class="ic" id="rRight" aria-label="Next page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <p class="r-hint" id="rHint"></p>
</div>

<button type="button" class="to-top ic" id="toTop" aria-label="Back to top" data-tip="Back to top" data-t-label="top" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>

<script src="data.js"></script>
<script src="site.js"></script>
</body>
</html>
