<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PDF — Natsumi Sugiyama</title>
<style>
  :root { --bg: #ECECEA; --ink: #161616; --quiet: #787878; --gap: 28px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Helvetica Neue", Helvetica, Arial, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; align-items: baseline; gap: 16px; padding: 14px max(16px, 2.6vw); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); }
  header .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .n { color: var(--quiet); font-variant-numeric: tabular-nums; margin-left: auto; white-space: nowrap; }
  header a { color: inherit; white-space: nowrap; }
  main { display: grid; gap: var(--gap); justify-items: center; padding: 12px max(16px, 2.6vw) 80px; }
  .row { display: flex; justify-content: center; width: 100%; }
  .page { position: relative; background: #fff; box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 8px 24px rgb(0 0 0 / .08); }
  .page canvas { display: block; width: 100%; height: 100%; }
  .row.spread .page:first-child { box-shadow: -1px 1px 2px rgb(0 0 0 / .06), -8px 8px 24px rgb(0 0 0 / .06); }
  .row.spread .page + .page { box-shadow: 1px 1px 2px rgb(0 0 0 / .06), 8px 8px 24px rgb(0 0 0 / .06); }
  .msg { color: var(--quiet); padding: 40px 0; }
</style>
</head>
<body>
<header><span class="t" id="t">PDF</span><span class="n" id="n"></span></header>
<main id="m"><p class="msg" id="msg">Loading…</p></main>
<!-- visitor counts without cookies (GoatCounter; the script is served from this site) -->
<script>window.goatcounter = { path: p => location.host + p };</script>
<script data-goatcounter="https://natyama.goatcounter.com/count" async src="lib/goatcounter/count.js"></script>
<script type="module">
// One layout for every browser: the cover alone, then two-page spreads (one page per row on phones).
const q = new URLSearchParams(location.search);
const file = q.get("file") || "";
const LIB = new URL("lib/pdfjs", location.href).href;   // pdf.js 4.10.38, served from this site (no outside requests)
const ok = /^[\w\-./%]+\.pdf$/i.test(file) && !file.includes("..") && !/^\w+:/.test(file);   // only PDFs of this site
const $ = s => document.querySelector(s);
if (q.get("t")) { $("#t").textContent = q.get("t"); document.title = q.get("t") + " — PDF"; }
if (!ok) { $("#msg").textContent = "PDF not found."; throw new Error("bad file"); }
const pdfjs = await import(LIB + "/legacy/build/pdf.min.mjs");
pdfjs.GlobalWorkerOptions.workerSrc = LIB + "/legacy/build/pdf.worker.min.mjs";
const doc = await pdfjs.getDocument({ url: file, cMapUrl: LIB + "/cmaps/", cMapPacked: true,
  standardFontDataUrl: LIB + "/standard_fonts/", wasmUrl: LIB + "/wasm/", iccUrl: LIB + "/iccs/", useSystemFonts: true }).promise;
$("#msg").remove();
addEventListener("contextmenu", e => { if (e.target.closest(".page")) e.preventDefault(); });
const N = doc.numPages, first = await doc.getPage(1), v1 = first.getViewport({ scale: 1 });
const aspect = v1.width / v1.height;
const two = () => innerWidth > 760 && aspect < 1.2;            // pages that are already spreads stay one per row
let rows = [];
function layout() {
  const m = $("#m"); m.innerHTML = ""; rows = [];
  const W = m.clientWidth - 2 * Math.max(16, innerWidth * 0.026), H = innerHeight - 110;
  const groups = two() ? [[1], ...Array.from({ length: Math.ceil((N - 1) / 2) }, (_, i) => [2 + 2 * i, 3 + 2 * i].filter(p => p <= N))] : Array.from({ length: N }, (_, i) => [i + 1]);
  for (const g of groups) {
    const per = two() && g.length ? 2 : 1;
    const h = Math.min(H, (W / per) / aspect), w = h * aspect;
    const row = document.createElement("div"); row.className = "row" + (g.length === 2 ? " spread" : "");
    for (const p of g) {
      const el = document.createElement("div"); el.className = "page"; el.dataset.p = p;
      el.style.width = w + "px"; el.style.height = h + "px"; row.appendChild(el);
    }
    m.appendChild(row); rows.push(row);
  }
  document.querySelectorAll(".page").forEach(el => io.observe(el));
}
const done = new WeakSet();
async function draw(el) {
  if (done.has(el)) return; done.add(el);
  const page = await doc.getPage(+el.dataset.p), dpr = Math.min(2, devicePixelRatio || 1);
  const vp = page.getViewport({ scale: el.clientWidth / page.getViewport({ scale: 1 }).width * dpr });
  const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
  el.appendChild(c);
  await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
}
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) draw(e.target); }), { rootMargin: "800px 0px" });
const counter = () => {
  const mid = innerHeight / 2; let cur = 1;
  for (const el of document.querySelectorAll(".page")) { const r = el.getBoundingClientRect(); if (r.top < mid) cur = +el.dataset.p; }
  $("#n").textContent = `${cur} / ${N}`;
};
addEventListener("scroll", counter, { passive: true });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { layout(); counter(); }, 200); });
layout(); counter();
</script>
</body>
</html>
